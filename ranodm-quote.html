<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="magic()">click me</button>
    <div id="body" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
    <script>
        function magic() {
            const arr = ['sun','moon','earth','mercury','venus','mars','jupiter','saturn','urens','neptune']
            const r = Math.floor(Math.random()*256)
            const g = Math.floor(Math.random()*256)
            const b = Math.floor(Math.random()*256)
            const box = document.createElement("div")
            box.style.backgroundColor = `rgb(${r} , ${g} , ${b})`;
            box.style.border = "2px solid black"
            box.style.width = "100px";
            box.style.height = "100px";
            box.style.textAlign = "center";
            box.innerText = arr[Math.floor(Math.random()*10)];
            document.getElementById('body').appendChild(box)
        }
    </script>
</body>
</html>
