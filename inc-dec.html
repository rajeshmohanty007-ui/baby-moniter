<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: flex; gap: 5px;">
    <button onclick="inc()">+</button>
    <div id="num" style="width: 150px; border: 2px solid black;">0</div>
    <button onclick="dec()">-</button>
    <script> 
    
        function inc() {
           let n = parseInt(document.getElementById('num').innerText); 
           document.getElementById('num').innerText = `${n+1}` ;
        }
        function dec() {
            let n = parseInt(document.getElementById('num').innerText); 
            if(n != 0) {
                document.getElementById('num').innerText = `${n-1}` 
            }
        }
    </script>
</body>
</html>
